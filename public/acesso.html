<!doctype html><html lang="pt-BR"><link rel="icon" type="image/png" sizes="192x192" href="/meu-bichu-icon.png?v=20261027"><link rel="alternate icon" href="/favicon.ico?v=20261027"><link rel="apple-touch-icon" href="/meu-bichu-icon.png?v=20261027"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Sua conta · Meu Bichu</title><link rel="stylesheet" href="/conta.css"><main><a href="/">← Meu Bichu</a><h1 id="title">Sua conta</h1><p id="intro"></p><form id="form"><label id="name-label">Como quer ser chamado?<input name="name" maxlength="80" autocomplete="name"></label><label id="email-label">E-mail<input name="email" type="email" maxlength="120" autocomplete="email"></label><label id="password-label">Senha — de 12 a 128 caracteres<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password"></label><label id="repeat-label">Repita a senha<input name="repeat" type="password" minlength="12" maxlength="128" autocomplete="new-password"></label><label id="legal-label" class="check"><input name="legal" type="checkbox">Li e aceito os <a href="/termos.html" target="_blank" rel="noopener">Termos de Uso</a> e li a <a href="/privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>.</label><label id="adult-label" class="check"><input name="adult" type="checkbox">Tenho 18 anos ou mais.</label><button id="submit">Continuar</button></form><p id="status" role="status" aria-live="polite"></p><nav><a href="/">Entrar</a><a href="/acesso.html?modo=cadastro">Criar conta</a><a href="/acesso.html?modo=recuperar">Recuperar senha</a><a href="/suporte.html">Suporte</a></nav></main><script type="module">
const params=new URLSearchParams(location.search),fragment=new URLSearchParams(location.hash.slice(1)),token=fragment.get('reset')||fragment.get('verify'),mode=fragment.has('verify')?'verify':fragment.has('reset')?'reset':params.get('modo')==='cadastro'?'register':'recover',staff=params.get('tipo')==='funcionario',form=document.querySelector('form'),status=document.querySelector('#status'),button=document.querySelector('button');
if(staff)document.querySelector('nav a').href='/equipe?acesso=funcionario';
const shown=mode==='register'?['name','email','password','repeat','legal','adult']:mode==='recover'?['email']:mode==='reset'?['password','repeat']:[];
for(const name of ['name','email','password','repeat','legal','adult']){document.querySelector('#'+name+'-label').hidden=!shown.includes(name);form.elements[name].required=shown.includes(name)}
document.querySelector('h1').textContent={register:'Crie sua conta',recover:staff?'Recuperar acesso de funcionário':'Recuperar sua senha',reset:'Defina uma nova senha',verify:'Confirme seu e-mail'}[mode];document.querySelector('#intro').textContent={register:'Sua conta de tutor não tem prazo de sete dias. Confirme seu e-mail para começar. Métricas de uso ficam desativadas inicialmente.',recover:'Informe o e-mail cadastrado. O link será individual e de uso único.',reset:'A alteração encerra as sessões anteriores da conta.',verify:'Toque abaixo para confirmar sua conta. Você poderá entrar depois da confirmação.'}[mode];
button.textContent={register:'Criar conta',recover:'Enviar link',reset:'Salvar nova senha',verify:'Confirmar e-mail'}[mode];
form.onsubmit=async event=>{event.preventDefault();status.textContent='';if(shown.includes('repeat')&&form.elements.password.value!==form.elements.repeat.value){status.textContent='As senhas precisam ser iguais.';return}button.disabled=true;try{const response=await fetch('/api/access/'+mode,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,email:form.elements.email.value,name:form.elements.name.value,password:form.elements.password.value,accepted:form.elements.legal.checked,adult:form.elements.adult.checked,legalVersion:'2026-10-26',kind:staff?'staff':'tutor'})}),data=await response.json();if(!response.ok)throw Error(data.error||'Não foi possível concluir.');status.textContent=data.message;form.elements.password.value='';form.elements.repeat.value='';if(mode==='reset'||mode==='verify'){history.replaceState(null,'',location.pathname);form.hidden=true}}catch(e){status.textContent=e.message}finally{button.disabled=false}};
</script></html>
