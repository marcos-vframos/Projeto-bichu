  &lt;script type=&quot;module&quot;&gt;
    import * as THREE from &#x27;https://esm.sh/three@0.164.1&#x27;;

    const markerBase = color(&#x27;--green&#x27;), markerSelected = color(&#x27;--yellow&#x27;);
    const mcsMarkerBase = color(&#x27;--purple&#x27;);
    const sphereGeo = new THREE.SphereGeometry(1, 28, 18);

    const parts = [];
    function ellipsoid(group, name, pos, scale, material, region=&#x27;fixed&#x27;) {

    }
    function bone(a,b,r,material=boneMat,group=boneGroup) {

    }
    function tuft(group, pos, direction, length, material=furDarkMat, width=1) {

    function regionGroup(name,pos,region){

    }

    ellipsoid(skinGroup,&#x27;thorax&#x27;,[.10,0,1.05],[.72,.40,.48],skinMat,&#x27;thorax&#x27;);
    ellipsoid(skinGroup,&#x27;abdomen&#x27;,[-.55,0,.99],[.55,.31,.34],skinMat,&#x27;abdomen&#x27;);
    ellipsoid(skinGroup,&#x27;pelvis&#x27;,[-.98,0,1.00],[.42,.34,.38],skinMat,&#x27;pelvis&#x27;);
    ellipsoid(skinGroup,&#x27;neck&#x27;,[.72,0,1.30],[.48,.31,.43],skinMat,&#x27;neck&#x27;);

    for (const side of [-1,1]) {
      ellipsoid(skinGroup,&#x27;frontUpper&#x27;,[.45,.29*side,.76],[.17,.17,.42],skinMat,&#x27;limb&#x27;);

      ellipsoid(skinGroup,&#x27;rearHock&#x27;,[-.82,.27*side,.33],[.11,.12,.35],skinMat);
      ellipsoid(skinGroup,&#x27;rearPaw&#x27;,[-.67,.27*side,.08],[.24,.15,.09],skinMat);
    }
    let tp=[-1.2,0,1.05];
    for(let i=0;i&lt;6;i++){ const np=[-1.5-.25*i,0,.94-.12*i]; bone(tp,np,.15-.014*i,skinMat,skinGroup); tp=np; }

    ellipsoid(markings,&#x27;blaze&#x27;,[1.31,-.255,1.56],[.12,.035,.22],markMat);
    ellipsoid(markings,&#x27;chest&#x27;,[.63,-.25,1.04],[.24,.055,.35],markMat,&#x27;neck&#x27;);
    for(const side of [-1,1]) ellipsoid(markings,&#x27;sock&#x27;,[.51,.30*side,.25],[.115,.12,.17],markMat);

    // Expressão e detalhes faciais reconhecíveis da raça.
    const eyeMat=new THREE.MeshStandardMaterial({color:color(&#x27;--blue&#x27;),roughness:.25,metalness:.08});
    const pupilMat=new THREE.MeshStandardMaterial({color:coat.clone().lerp(color(&#x27;--background&#x27;),.45),roughness:.2});
    for(const side of [-1,1]){
      ellipsoid(faceGroup,&#x27;eye&#x27;,[1.31,.265*side,1.57],[.064,.032,.054],eyeMat);
      ellipsoid(faceGroup,&#x27;pupil&#x27;,[1.325,.292*side,1.57],[.027,.012,.029],pupilMat);

    for(const side of [-1,1]) for(const rear of [false,true]) for(let i=0;i&lt;8;i++){
      const x=rear?-.91:.45, z=.72-i*.055;
      tuft(legFur,[x,.33*side,z],[0,.55*side,-.82],.14+(i%3)*.012,i&gt;5?furWhiteMat:furDarkMat,.82);

    // Contorno comparativo fixo do BCS 5.

      if(m.userData.baseScale) c.userData={basePos:[...m.userData.basePos],baseScale:[...m.userData.baseScale],region:m.userData.region};
      referenceGroup.add(c);

    referenceGroup.visible=false;

    // Marcos clicáveis usados na avaliação clínica visual e por palpação.
    const markerData={
      ribs:{label:&#x27;Costelas&#x27;,region:&#x27;thorax&#x27;,pos:[.08,-.46,1.15]},
      waist:{label:&#x27;Cintura dorsal&#x27;,region:&#x27;abdomen&#x27;,pos:[-.58,-.37,1.16]},
      tuck:{label:&#x27;Retração abdominal&#x27;,region:&#x27;abdomen&#x27;,pos:[-.43,-.29,.69]},
      lumbar:{label:&#x27;Região lombar&#x27;,region:&#x27;pelvis&#x27;,pos:[-.64,-.24,1.34]},

    };
    const markerGeo=new THREE.SphereGeometry(.075,18,12);
    Object.entries(markerData).forEach(([key,d])=&gt;{

      const m=new THREE.Mesh(markerGeo,mat); m.position.set(...d.pos); m.userData={key,kind:&#x27;bcs&#x27;,region:d.region,basePos:[...d.pos]}; markerGroup.add(m);

    const mcsMarkerData={

    Object.entries(mcsMarkerData).forEach(([key,d])=&gt;{
      const mat=new THREE.MeshStandardMaterial({color:mcsMarkerBase,emissive:mcsMarkerBase,emissiveIntensity:.25,roughness:.35});
      const m=new THREE.Mesh(markerGeo,mat); m.position.set(...d.pos); m.userData={key,kind:&#x27;mcs&#x27;,basePos:[...d.pos]}; mcsMarkerGroup.add(m);

    mcsMarkerGroup.visible=false;

    const fatSpecs=[[&#x27;ribs&#x27;,[.08,0,1.05],[.69,.38,.45],&#x27;thorax&#x27;],[&#x27;lumbar&#x27;,[-.52,0,1.20],[.48,.29,.18],&#x27;pelvis&#x27;],[&#x27;abdomen&#x27;,[-.45,0,.82],[.43,.27,.19],&#x27;abdomen&#x27;],[&#x27;tail&#x27;,[-1.15,0,1.08],[.27,.25,.23],&#x27;tail&#x27;],[&#x27;sternum&#x27;,[.15,0,.72],[.38,.25,.14],&#x27;abdomen&#x27;]];
    fatSpecs.forEach(x=&gt;ellipsoid(fatGroup,x[0],x[1],x[2],fatMat,x[3]));

    const muscleSpecs=[[&#x27;latissimus&#x27;,[-.10,0,1.15],[.66,.31,.28],&#x27;spine&#x27;],[&#x27;pectorals&#x27;,[.35,0,.87],[.42,.30,.25],&#x27;scapular&#x27;],[&#x27;abdominal&#x27;,[-.55,0,.91],[.48,.26,.25],&#x27;spine&#x27;],[&#x27;gluteal&#x27;,[-.98,0,1.05],[.36,.31,.31],&#x27;pelvis&#x27;],[&#x27;neck&#x27;,[.73,0,1.35],[.43,.27,.34],&#x27;scapular&#x27;],[&#x27;temporalL&#x27;,[1.13,.20,1.61],[.20,.09,.16],&#x27;temporal&#x27;],[&#x27;temporalR&#x27;,[1.13,-.20,1.61],[.20,.09,.16],&#x27;temporal&#x27;]];
    muscleSpecs.forEach(x=&gt;ellipsoid(muscleGroup,x[0],x[1],x[2],muscleMat,x[3]));
    for(const side of [-1,1]){
      ellipsoid(muscleGroup,&#x27;deltoid&#x27;,[.45,.27*side,.89],[.19,.14,.28],muscleMat,&#x27;scapular&#x27;);
      ellipsoid(muscleGroup,&#x27;quadriceps&#x27;,[-.91,.27*side,.70],[.23,.18,.36],muscleMat,&#x27;pelvis&#x27;);
    }

    const spine=[]; for(let i=0;i&lt;13;i++) spine.push([-1.15+i*.16,0,1.12+.13*Math.sin(i/8*Math.PI)]);
    spine.forEach((p,i)=&gt;{ellipsoid(boneGroup,&#x27;vertebra&#x27;,p,[.06,.06,.06],boneMat); if(i) bone(spine[i-1],p,.032);});
    ellipsoid(boneGroup,&#x27;skull&#x27;,[1.18,0,1.50],[.34,.23,.27],boneMat);
    ellipsoid(boneGroup,&#x27;pelvis&#x27;,[-1.02,0,1.03],[.30,.25,.23],boneMat);
    for(let i=0;i&lt;7;i++){
      const x=-.35+i*.138, z=1.14+.10*Math.cos((x+.1)*2.2), w=.30+.08*Math.cos(i/6*Math.PI);

    }
    for(const s of [-1,1]){
      const y=.24*s; bone([.36,y,1.14],[.48,y,.86],.05); bone([.48,y,.86],[.45,y,.57],.045); bone([.45,y,.57],[.50,y,.17],.034);
      bone([-1.00,y,1.00],[-.83,y,.66],.052); bone([-.83,y,.66],[-.82,y,.25],.038);
    }

    function regional(region, lean, obese) {
      const map={thorax:[.03,-.05,.34,-.16,.20,-.08,0,0],abdomen:[.06,-.08,.62,-.30,.58,-.35,-.20,.12],pelvis:[.08,-.04,.48,-.14,.28,-.10,-.05,.02],tail:[.18,-.05,.70,-.12,.62,-.12,-.04,.01],neck:[.04,-.03,.22,-.07,.20,-.06,-.02,.01],limb:[.02,-.03,.13,-.08,.12,-.06,-.01,.01],fixed:[0,0,.02,-.02,.02,-.02,0,0]};
      const v=map[region]||map.fixed;
      return [1+v[0]*obese+v[1]*lean,1+v[2]*obese+v[3]*lean,1+v[4]*obese+v[5]*lean,v[6]*obese+v[7]*lean];
    }
    let currentReference=5;
    function updateComparison(){
      const delta=currentScore-currentReference, magnitude=Math.abs(delta);
      let text;
      if(delta===0) text=`BCS atual ${currentScore} e referência ${currentReference} coincidem.`;
      else if(delta&gt;0) text=`BCS atual ${currentScore} versus ${currentReference}: maior cobertura costal e volume abdominal/lombar, cintura e retração abdominal menos marcadas.`;
      else text=`BCS atual ${currentScore} versus ${currentReference}: menor cobertura costal e volume abdominal/lombar, cintura e retração abdominal mais marcadas.`;
      const degree=magnitude===0?&#x27;&#x27;:magnitude===1?&#x27; Diferença sutil entre escores adjacentes.&#x27;:magnitude&lt;=3?&#x27; Diferença regional moderada.&#x27;:&#x27; Diferença estrutural ampla; compare também as camadas internas.&#x27;;
      root.querySelector(&#x27;#comparison-detail&#x27;).innerHTML=`&lt;strong&gt;Comparação:&lt;/strong&gt; ${text}${degree}`;
    }
    function updateReference(score){
      currentReference=Number(score);
      const lean=Math.max(0,(5-currentReference)/4), obese=Math.max(0,(currentReference-5)/4);
      referenceGroup.children.forEach(m=&gt;{
        if(!m.userData.baseScale) return;
        const [sx,sy,sz,dz]=regional(m.userData.region,lean,obese), b=m.userData.baseScale, p=m.userData.basePos;
        m.scale.set(b[0]*sx,b[1]*sy,b[2]*sz); m.position.set(p[0],p[1],p[2]+dz);
      });

      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
