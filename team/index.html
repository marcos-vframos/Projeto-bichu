<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Bichu · Equipe</title><style>body{font:16px/1.6 system-ui;background:#f2f6ee;color:#193c30;margin:0}main{max-width:1020px;margin:32px auto;padding:0 20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:28px;line-height:1.2}button,input,select,textarea{font:inherit;border:1px solid #a9b9a6;border-radius:10px;padding:10px;box-sizing:border-box}button{background:#194b37;color:white;cursor:pointer}button:disabled{opacity:.5}input,textarea,select{background:white;color:#193c30;max-width:100%}textarea{display:block;width:100%}label{display:block;margin:12px 0}form,article,section.panel{background:#fffdf8;border:1px solid #d2ddcd;border-radius:18px;padding:22px;margin:20px 0}article p{white-space:pre-wrap}#status{white-space:pre-wrap}a{color:#164f39}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #dde4d8}.muted{font-size:14px;color:#53694f}blockquote{border-left:3px solid #527b58;padding-left:14px;margin-left:0}input{display:block;width:100%}[hidden]{display:none!important}</style><main><header><h1>Meu Bichu · Equipe</h1><button id="logout" hidden>Sair</button></header><p id="identity"></p><p id="status" role="status" aria-live="polite"></p><form id="login"><h2>Acesso da equipe</h2><label>E-mail<input type="email" name="email" required autocomplete="username"></label><label>Senha<input type="password" name="password" required autocomplete="current-password"></label><button>Entrar</button><p class="muted">Acesso individual. Somente casos atribuídos ao seu usuário.</p></form><section id="management" hidden class="panel"><a href="/painel">Voltar ao painel do proprietário</a><h2>Funcionários</h2><form id="create"><label>Nome<input name="name" required maxlength="100"></label><label>E-mail<input type="email" name="email" required></label><label>Senha inicial (mínimo 12 caracteres)<input type="password" name="password" required minlength="12" autocomplete="new-password"></label><button>Criar acesso</button></form><div id="users"></div><button id="audit">Consultar auditoria</button><div id="audit-list"></div></section><section id="queue" hidden><header><h2 id="queue-title">Meus casos</h2><button id="refresh">Atualizar</button></header><p class="muted">Dados de suporte. Este acesso não permite consultar peso, saúde, localização, fotos ou exportações.</p><div id="cases"></div><button id="more" hidden>Carregar anteriores</button></section></main><script type="module">
const $=s=>document.querySelector(s);let role='',users=[],offset=null,working=false;const show=s=>$('#status').textContent=s;
async function api(path,body,method){const r=await fetch('/api/team/'+path,{method:method||(body?'POST':'GET'),credentials:'same-origin',cache:'no-store',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha na operação');return d}
function text(tag,value){const e=document.createElement(tag);e.textContent=value||'';return e}function button(label,fn){const b=text('button',label);b.type='button';b.onclick=async()=>{b.disabled=true;try{await fn()}catch(e){show(e.message)}finally{b.disabled=false}};return b}
async function start(){try{const me=await api('me');role=me.role;$('#login').hidden=true;$('#queue').hidden=false;$('#identity').textContent=me.name+(role==='owner'?' · Proprietário':' · Atendente');$('#logout').hidden=role==='owner';$('#management').hidden=role!=='owner';if(role==='owner')await loadUsers();await loadCases()}catch(e){$('#login').hidden=false;$('#queue').hidden=true;$('#management').hidden=true}}
async function loadUsers(){users=await api('users');$('#users').replaceChildren();for(const u of users){const row=text('p',u.name+' · '+u.email+(u.active?'':' · Revogado'));if(u.active)row.append(' ',button('Revogar acesso',async()=>{if(!confirm('Revogar este acesso e encerrar suas sessões?'))return;await api('users/'+u.id+'/revoke',{});await loadUsers();await loadCases();show('Acesso revogado.')}));$('#users').append(row)}}
async function loadCases(more=false){if(working)return;working=true;try{const d=await api('cases'+(more&&offset!==null?'?offset='+offset:''));if(!more)$('#cases').replaceChildren();offset=d.nextOffset;$('#more').hidden=offset===null;if(!d.items.length&&!more)$('#cases').append(text('p','Nenhum caso disponível.'));for(const c of d.items){const article=document.createElement('article');article.append(text('h3',(c.category||'Feedback')+' · '+(c.status||'recebido')),text('small',new Date(c.created).toLocaleString('pt-BR')),text('p',c.message));for(const r of c.replies){const block=document.createElement('blockquote');block.append(text('strong',r.authorName||'Responsável'),text('p',r.message));article.append(block)}if(role==='owner'){const selector=document.createElement('select');selector.setAttribute('aria-label','Atribuir funcionário');const none=text('option','Sem funcionário');none.value='';selector.append(none);for(const u of users.filter(u=>u.active)){const op=text('option',u.name);op.value=u.id;selector.append(op)}selector.value=c.assignedTo||'';article.append(selector,button('Salvar atribuição',async()=>{await api('cases/'+c.id+'/assign',{userId:selector.value||null});show('Atribuição salva.')}))}const form=document.createElement('form'),message=document.createElement('textarea'),status=document.createElement('select');message.required=true;message.maxLength=2000;message.rows=3;message.setAttribute('aria-label','Resposta ao tutor');for(const [value,label]of [['respondido','Respondido'],['em_avaliacao','Em avaliação'],['resolvido','Resolvido']]){const op=text('option',label);op.value=value;status.append(op)}status.setAttribute('aria-label','Status do caso');const send=text('button','Enviar resposta'),replyId=crypto.randomUUID();form.append(message,status,send);form.onsubmit=async e=>{e.preventDefault();send.disabled=true;try{await api('cases/'+c.id+'/reply',{message:message.value,status:status.value,replyId});show('Resposta salva e disponível ao tutor.');await loadCases()}catch(e){show(e.message)}finally{send.disabled=false}};article.append(form);$('#cases').append(article)}}catch(e){show(e.message)}finally{working=false}}
$('#login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const f=new FormData(e.target);await api('login',{email:f.get('email'),password:f.get('password')});e.target.reset();show('');await start()}catch(e){show(e.message)}finally{b.disabled=false}};
$('#create').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const f=new FormData(e.target);await api('users',Object.fromEntries(f));e.target.reset();await loadUsers();show('Acesso criado. Envie as credenciais individualmente ao funcionário.')}catch(e){show(e.message)}finally{b.disabled=false}};
$('#refresh').onclick=()=>loadCases();$('#more').onclick=()=>loadCases(true);$('#logout').onclick=async()=>{await api('logout',{});location.reload()};$('#audit').onclick=async()=>{try{const a=await api('audit');$('#audit-list').replaceChildren(...a.map(r=>text('p',new Date(r.created_at).toLocaleString('pt-BR')+' · '+(r.actor_name||r.actor_id)+' · '+r.action+' · '+(r.record_id||''))))}catch(e){show(e.message)}};
await start();setInterval(()=>{if(!document.hidden&&role&&![...document.querySelectorAll('textarea')].some(el=>el.value.trim()))void loadCases()},30000);
</script></html>
