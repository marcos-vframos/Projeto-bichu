<!doctype html><html lang="pt-BR"><link rel="icon" type="image/png" sizes="192x192" href="/meu-bichu-icon.png?v=20261027"><link rel="alternate icon" href="/favicon.ico?v=20261027"><link rel="apple-touch-icon" href="/meu-bichu-icon.png?v=20261027"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Bichu · Escolher conta</title><style>body{font:18px/1.6 system-ui;background:#f2f6ee;color:#193c30;margin:0}main{max-width:700px;margin:40px auto;padding:24px}button,a{font:inherit;color:inherit}button{display:block;width:100%;padding:16px;margin:12px 0;text-align:left;border:1px solid #b7c9b7;border-radius:12px;background:white;cursor:pointer}p{font-size:16px}</style><main><h1>Abrir app do tutor</h1><p>Acesso privado do proprietário, sem usuário e senha. Escolha a conta: alterações serão salvas nela. Os prazos dos convidados permanecem iguais.</p><p id="status" role="status">Verificando acesso…</p><div id="accounts"></div><p><a href="/painel">Painel do proprietário</a> · <a href="/equipe">Área da equipe</a></p></main><script type="module">
const status=document.querySelector('#status'),list=document.querySelector('#accounts');
try{const r=await fetch('/api/pilot/owner/tutor-accounts',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error('Abra primeiro seu link privado de proprietário neste navegador.');const accounts=await r.json();status.textContent='Escolha uma conta para abrir:';for(const account of accounts){const b=document.createElement('button');b.textContent=account.email;b.onclick=async()=>{for(const el of list.querySelectorAll('button'))el.disabled=true;try{const response=await fetch('/api/pilot/owner/tutor-access',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({accountId:account.id})});if(!response.ok)throw Error('Não foi possível abrir a conta');sessionStorage.removeItem('mb_offline_session');sessionStorage.removeItem('mb_active_account');location.assign('/')}catch(e){status.textContent=e.message;for(const el of list.querySelectorAll('button'))el.disabled=false}};list.append(b)}}catch(e){status.textContent=e.message}
</script></html>
