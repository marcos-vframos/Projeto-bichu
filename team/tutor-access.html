<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Bichu · Escolher conta</title><link rel="icon" href="/meu-bichu-icon.png"><style>body{font:16px/1.6 system-ui;background:#f2f6ee;color:#193c30;margin:0}main{max-width:760px;margin:24px auto;padding:24px}button,a{font:inherit;color:inherit}button,.entry{display:block;padding:14px;margin:10px 0;text-align:left;border:1px solid #b7c9b7;border-radius:10px;background:white;cursor:pointer;box-sizing:border-box;width:100%;overflow-wrap:anywhere}details{border:1px solid #b7c9b7;border-radius:14px;margin:14px 0;padding:14px;background:#fff}summary{cursor:pointer;font-weight:600;min-height:32px}small{display:block;color:#456653}button:disabled{opacity:.6}p{font-size:14px}</style></head><body><main><h1>Abrir app do tutor</h1><p>Escolha o ambiente e depois a conta. Alterações são salvas na conta aberta; os bancos permanecem separados.</p><p id="status" role="status">Verificando acesso…</p><div id="accounts"></div><p><a href="/painel">Painel deste laboratório</a> · <a href="/equipe">Área da equipe</a></p></main><script type="module">
const status=document.querySelector('#status'),list=document.querySelector('#accounts');
const el=(tag,text)=>{const node=document.createElement(tag);if(text)node.textContent=text;return node};
function group(label,description){const box=el('details');box.append(el('summary',label));if(description)box.append(el('p',description));list.append(box);return box}
async function open(account){for(const b of list.querySelectorAll('button'))b.disabled=true;try{const response=await fetch('/api/pilot/owner/tutor-access',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({accountId:account.id})});if(!response.ok)throw Error('Não foi possível abrir a conta');sessionStorage.removeItem('mb_offline_session');sessionStorage.removeItem('mb_active_account');location.assign('/')}catch(e){status.textContent=e.message;for(const b of list.querySelectorAll('button'))b.disabled=false}}
try{const [r,directory]=await Promise.all([fetch('/api/pilot/owner/tutor-accounts',{credentials:'same-origin',cache:'no-store'}),fetch('/api/pilot/owner/account-directory',{credentials:'same-origin',cache:'no-store'})]);if(!r.ok)throw Error('Abra primeiro o painel autorizado deste laboratório.');const accounts=await r.json();if(directory.ok){const data=await directory.json();for(const item of data.groups){const box=group(item.label,item.description);if(item.accounts){for(const account of item.accounts){const b=el('button',account.email+(account.active?'':' · desativada'));b.disabled=!account.active;b.onclick=()=>open(account);box.append(b)}}for(const itemLink of item.links||[]){const a=el('a',itemLink.label+' ↗');a.className='entry';a.href=itemLink.url;a.target='_blank';a.rel='noopener noreferrer';box.append(a)}}}else{const box=group('Contas do aplicativo atual');for(const account of accounts){const b=el('button',account.email);b.onclick=()=>open(account);box.append(b)}}status.textContent='Abra um dos menus para escolher. Atalhos externos preservam a autenticação de cada ambiente.'}catch(e){status.textContent=e.message}
</script></body></html>
