<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso master · Meu Bichu</title><link rel="icon" href="/meu-bichu-icon.png"><link rel="stylesheet" href="/team-ui/style.css"></head>
<body><main style="max-width:640px"><header><div><p class="eyebrow">Meu Bichu · Testes do criador</p><h1>Acesso master</h1></div></header>
<section class="panel"><form id="master-login"><label>Área de acesso<select name="area" id="area"><option value="proprietario">Painel do proprietário</option><option value="matriz">Matriz original · Piloto 01</option><option value="funcionario">Área dos funcionários</option></select></label><label>E-mail<input name="email" type="email" autocomplete="username" maxlength="120" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" maxlength="200" required></label><p class="muted">Use suas credenciais master nas três áreas. A matriz mantém os registros originais; as ações na equipe ficam identificadas no histórico.</p><button id="submit">Entrar</button><p id="message" role="status" aria-live="polite"></p></form></section>
<script>
const form=document.getElementById('master-login'),message=document.getElementById('message'),submit=document.getElementById('submit'),area=document.getElementById('area');
const requested=new URLSearchParams(location.search).get('area');if(['proprietario','matriz','funcionario'].includes(requested))area.value=requested;
form.addEventListener('submit',async event=>{event.preventDefault();submit.disabled=true;message.textContent='Verificando acesso…';try{const response=await fetch('/api/access/master/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))}),data=await response.json();if(!response.ok)throw Error(data.error||'Não foi possível entrar.');form.elements.password.value='';sessionStorage.removeItem('mb_offline_session');sessionStorage.removeItem('mb_active_account');location.replace(data.redirect)}catch(error){message.textContent=error.message;submit.disabled=false}});
</script></main></body></html>
