name: Android build (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK de teste e AAB sem assinatura de publicação
        working-directory: android
        run: gradle --no-daemon assembleDebug bundleRelease lint
      - uses: actions/upload-artifact@v4
        with:
          name: meu-bichu-android-nao-publicado
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-*.html
